openapi: 3.1.0
info:
  title: Toudocu Documentation Changes HTTP API
  version: "1"
  description: Wire-level contract for the read-only changes service exposed by toudocu serve; configured locale mounts do not expose it.
servers:
  - url: /
paths:
  /_toudocu/api/changes:
    get:
      operationId: getChangesSummary
      summary: Build a filtered documentation change-set report
      parameters:
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        "200":
          description: Change set report schema v1
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangeSetReport"}
              example: {schemaVersion: 1, repository: {root: /repo, dirty: true}, comparison: {base: {type: commit}, target: {type: working-tree}}, changeSetDigest: abc123, summary: {files: {added: 0, modified: 1, deleted: 0, renamed: 0, copied: 0, typeChanged: 0, untracked: 0}, lines: {added: 2, deleted: 1}, entities: {}, classifications: {contract: 1}}, changes: [], diagnostics: []}
        "304": {description: The current ETag matches, headers: {ETag: {schema: {type: string}}, Cache-Control: {$ref: "#/components/headers/NoStore"}}}
        "400": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
    head:
      operationId: headChangesSummary
      summary: Read the current change-set ETag without a response body
      parameters:
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
      responses:
        "200": {description: Summary exists, headers: {ETag: {schema: {type: string}}, Cache-Control: {$ref: "#/components/headers/NoStore"}}}
        "400": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
  /_toudocu/api/changes/file:
    get:
      operationId: getChangedFile
      summary: Read one documentation change with source diff hunks
      parameters:
        - {$ref: "#/components/parameters/Path"}
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
      responses:
        "200":
          description: Documentation change
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentationChange"}
              example: {status: modified, path: docs/index.md, gitState: {staged: false, unstaged: true, untracked: false}, lines: {added: 2, deleted: 1}, binary: false, classification: permanent-documentation, entitiesBefore: [], entitiesAfter: [], sourceDiffAvailable: true, renderedDiffAvailable: true, semanticDiffAvailable: false, sourceDiffHunks: [], renderedSections: [], mermaidBlocks: [], semanticChanges: [], relationChanges: [], diagnostics: []}
        "400": {$ref: "#/components/responses/ChangesError"}
        "404": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
  /_toudocu/api/changes/task:
    get:
      operationId: getChangedTaskImpact
      summary: Read task impact for a selected TASK or BUG
      parameters:
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
      responses:
        "200":
          description: Task impact report; either task or id selects the work item
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskImpactReport"}
              example: {taskId: TASK-API-001, declared: [], actual: [], taskChanges: [], diagnostics: []}
        "400": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
  /_toudocu/api/changes/content:
    get:
      operationId: getChangedContent
      summary: Read raw content from one comparison side
      parameters:
        - {$ref: "#/components/parameters/Path"}
        - {$ref: "#/components/parameters/Side"}
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
      responses:
        "200": {description: Original detected media type, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}, X-Content-Type-Options: {$ref: "#/components/headers/NoSniff"}, Content-Security-Policy: {$ref: "#/components/headers/RawContentCSP"}}, content: {"*/*": {schema: {type: string, contentEncoding: binary}, example: "# Project\n"}}}
        "204": {description: Side is absent for an added or deleted file, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}}
        "400": {$ref: "#/components/responses/ChangesError"}
        "404": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "413": {$ref: "#/components/responses/ChangesError"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
  /_toudocu/api/changes/render:
    get:
      operationId: getRenderedChangedContent
      summary: Render Markdown from one comparison side
      parameters:
        - {$ref: "#/components/parameters/Path"}
        - {$ref: "#/components/parameters/Side"}
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
      responses:
        "200": {description: Sanitized rendered Markdown, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {text/html: {schema: {type: string}, example: "<h1>Project</h1>"}}}
        "204": {description: Side is absent for an added or deleted file, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}}
        "400": {$ref: "#/components/responses/ChangesError"}
        "404": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "413": {$ref: "#/components/responses/ChangesError"}
        "415": {$ref: "#/components/responses/ChangesError"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
  /_toudocu/api/changes/screen-map:
    get:
      operationId: getChangedScreenMap
      summary: Read screen and transition overlay schema v1
      parameters:
        - {$ref: "#/components/parameters/Base"}
        - {$ref: "#/components/parameters/BranchBase"}
        - {$ref: "#/components/parameters/Target"}
        - {$ref: "#/components/parameters/Type"}
        - {$ref: "#/components/parameters/Status"}
        - {$ref: "#/components/parameters/Module"}
        - {$ref: "#/components/parameters/Task"}
        - {$ref: "#/components/parameters/TaskAlias"}
      responses:
        "200": {description: Screen map overlay, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ScreenMapOverlay"}, example: {schemaVersion: 1, changeSetDigest: abc123, nodes: [], edges: []}}}}
        "400": {$ref: "#/components/responses/ChangesError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "503": {$ref: "#/components/responses/ChangesError"}
        "500": {$ref: "#/components/responses/ChangesError"}
components:
  headers:
    NoStore: {schema: {type: string, const: no-store}}
    NoSniff: {schema: {type: string, const: nosniff}}
    RawContentCSP: {schema: {type: string, const: "default-src 'none'; style-src 'none'; sandbox"}}
  parameters:
    Base: {name: base, in: query, schema: {type: string}, example: HEAD}
    BranchBase: {name: branchBase, in: query, schema: {type: string}, example: main}
    Target: {name: target, in: query, schema: {type: string, default: working-tree}}
    Type: {name: type, in: query, schema: {type: string}}
    Status: {name: status, in: query, schema: {type: string}}
    Module: {name: module, in: query, schema: {type: string}}
    Task: {name: task, in: query, schema: {type: string}}
    TaskAlias: {name: id, in: query, description: Backward-compatible alias used when task is absent, schema: {type: string}}
    Path: {name: path, in: query, required: true, schema: {type: string, minLength: 1}, example: docs/index.md}
    Side: {name: side, in: query, required: true, schema: {type: string, enum: [before, after]}}
  responses:
    ChangesError:
      description: Changes API error
      headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/DiagnosticEnvelope"}, example: {schemaVersion: 1, diagnostics: [{severity: error, code: invalid-change-side, message: side должен быть before или after}]}}}
    MethodNotAllowed:
      description: Method not allowed
      headers: {Allow: {schema: {type: string}}, Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/DiagnosticEnvelope"}, example: {schemaVersion: 1, diagnostics: [{severity: error, code: method_not_allowed, message: Метод не поддерживается}]}}}
  schemas:
    Issue:
      type: object
      required: [severity, code, message]
      properties:
        severity: {type: string, enum: [error, warning, info]}
        code: {type: string}
        message: {type: string}
        documentPath: {type: string}
        line: {type: integer, minimum: 0}
        column: {type: integer, minimum: 0}
    DiagnosticEnvelope:
      type: object
      required: [schemaVersion, diagnostics]
      properties:
        schemaVersion: {type: integer, const: 1}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/Issue"}, minItems: 1}
    ChangeSide:
      type: object
      required: [type]
      properties:
        type: {type: string}
        revision: {type: string}
        resolved: {type: string}
        displayRef: {type: string}
    ChangeComparison:
      type: object
      required: [base, target]
      properties:
        base: {$ref: "#/components/schemas/ChangeSide"}
        target: {$ref: "#/components/schemas/ChangeSide"}
    ChangeRepository:
      type: object
      required: [root, dirty]
      properties:
        root: {type: string}
        branch: {type: string}
        head: {type: string}
        dirty: {type: boolean}
    ChangeLineStats:
      type: object
      required: [added, deleted]
      properties: {added: {type: integer}, deleted: {type: integer}}
    ChangeFileSummary:
      type: object
      required: [added, modified, deleted, renamed, copied, typeChanged, untracked]
      properties:
        added: {type: integer}
        modified: {type: integer}
        deleted: {type: integer}
        renamed: {type: integer}
        copied: {type: integer}
        typeChanged: {type: integer}
        untracked: {type: integer}
    ChangeSummary:
      type: object
      required: [files, lines, entities, classifications]
      properties:
        files: {$ref: "#/components/schemas/ChangeFileSummary"}
        lines: {$ref: "#/components/schemas/ChangeLineStats"}
        entities: {type: object, additionalProperties: {type: integer}}
        classifications: {type: object, additionalProperties: {type: integer}}
    ChangeEntity:
      type: object
      required: [type]
      properties: {id: {type: string}, type: {type: string}, title: {type: string}}
    ChangeLocation:
      type: object
      required: [path]
      properties: {path: {type: string}, line: {type: integer}}
    ChangeGitState:
      type: object
      required: [staged, unstaged, untracked]
      properties:
        staged: {type: boolean}
        unstaged: {type: boolean}
        untracked: {type: boolean}
        committedInBranch: {type: boolean}
    SourceDiffHunk:
      type: object
      required: [id, header, oldStart, oldLines, newStart, newLines, patch]
      properties:
        id: {type: string}
        header: {type: string}
        oldStart: {type: integer}
        oldLines: {type: integer}
        newStart: {type: integer}
        newLines: {type: integer}
        patch: {type: string}
    RenderedSectionChange:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string}
        titleBefore: {type: string}
        titleAfter: {type: string}
        anchorBefore: {type: string}
        anchorAfter: {type: string}
        sourceBefore: {$ref: "#/components/schemas/ChangeLocation"}
        sourceAfter: {$ref: "#/components/schemas/ChangeLocation"}
    MermaidBlockChange:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string}
        caption: {type: string}
        before: {type: string}
        after: {type: string}
        sourceBefore: {$ref: "#/components/schemas/ChangeLocation"}
        sourceAfter: {$ref: "#/components/schemas/ChangeLocation"}
    AssetMetadata:
      type: object
      required: [mediaType]
      properties:
        mediaType: {type: string}
        width: {type: integer}
        height: {type: integer}
        aspectRatio: {type: number}
        transparency: {type: boolean}
    AssetDiffMetadata:
      type: object
      properties:
        before: {$ref: "#/components/schemas/AssetMetadata"}
        after: {$ref: "#/components/schemas/AssetMetadata"}
    ScreenNodeSnapshot:
      type: object
      required: [id]
      properties:
        id: {type: string}
        title: {type: string}
        route: {type: string}
        module: {type: string}
        status: {type: string}
        type: {type: string}
    ScreenTransitionSnapshot:
      type: object
      required: [id, source, target]
      properties:
        id: {type: string}
        source: {type: string}
        target: {type: string}
        action: {type: string}
        condition: {type: string}
        state: {type: string}
        error: {type: string}
        useCase: {type: string}
        line: {type: integer}
    ScreenTransitionChange:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string}
        before: {$ref: "#/components/schemas/ScreenTransitionSnapshot"}
        after: {$ref: "#/components/schemas/ScreenTransitionSnapshot"}
    ScreenDiffMetadata:
      type: object
      required: [transitions]
      properties:
        before: {$ref: "#/components/schemas/ScreenNodeSnapshot"}
        after: {$ref: "#/components/schemas/ScreenNodeSnapshot"}
        transitions: {type: array, items: {$ref: "#/components/schemas/ScreenTransitionChange"}}
    RelationChange:
      type: object
      required: [kind, source, target]
      properties:
        kind: {type: string}
        source: {$ref: "#/components/schemas/ChangeEntity"}
        target: {$ref: "#/components/schemas/ChangeEntity"}
    SemanticChange:
      type: object
      required: [kind, entity, summary]
      properties:
        kind: {type: string}
        entity: {$ref: "#/components/schemas/ChangeEntity"}
        subject: {$ref: "#/components/schemas/ChangeEntity"}
        field: {type: string}
        before: {}
        after: {}
        summary: {type: string}
        sourceBefore: {$ref: "#/components/schemas/ChangeLocation"}
        sourceAfter: {$ref: "#/components/schemas/ChangeLocation"}
        compatibility: {type: string, enum: [breaking, potentially-breaking, non-breaking, informational]}
    DocumentationChange:
      type: object
      required: [status, path, gitState, lines, binary, classification, entitiesBefore, entitiesAfter, sourceDiffAvailable, renderedDiffAvailable, semanticDiffAvailable, sourceDiffHunks, renderedSections, mermaidBlocks, semanticChanges, relationChanges, diagnostics]
      properties:
        status: {type: string}
        path: {type: string}
        oldPath: {type: string}
        gitState: {$ref: "#/components/schemas/ChangeGitState"}
        lines: {$ref: "#/components/schemas/ChangeLineStats"}
        binary: {type: boolean}
        oldSize: {type: integer}
        newSize: {type: integer}
        classification: {type: string}
        entitiesBefore: {type: array, items: {$ref: "#/components/schemas/ChangeEntity"}}
        entitiesAfter: {type: array, items: {$ref: "#/components/schemas/ChangeEntity"}}
        sourceDiffAvailable: {type: boolean}
        renderedDiffAvailable: {type: boolean}
        semanticDiffAvailable: {type: boolean}
        sourceDiff: {type: string}
        sourceDiffHunks: {type: array, items: {$ref: "#/components/schemas/SourceDiffHunk"}}
        renderedSections: {type: array, items: {$ref: "#/components/schemas/RenderedSectionChange"}}
        mermaidBlocks: {type: array, items: {$ref: "#/components/schemas/MermaidBlockChange"}}
        asset: {$ref: "#/components/schemas/AssetDiffMetadata"}
        screen: {$ref: "#/components/schemas/ScreenDiffMetadata"}
        semanticChanges: {type: array, items: {$ref: "#/components/schemas/SemanticChange"}}
        relationChanges: {type: array, items: {$ref: "#/components/schemas/RelationChange"}}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/Issue"}}
    TaskImpactEntry:
      type: object
      required: [path, declared, changed]
      properties: {path: {type: string}, declared: {type: boolean}, changed: {type: boolean}, created: {type: boolean}}
    TaskImpactReport:
      type: object
      required: [taskId, declared, actual, taskChanges, diagnostics]
      properties:
        taskId: {type: string}
        declared: {type: array, items: {$ref: "#/components/schemas/TaskImpactEntry"}}
        actual: {type: array, items: {$ref: "#/components/schemas/TaskImpactEntry"}}
        taskChanges: {type: array, items: {$ref: "#/components/schemas/DocumentationChange"}}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/Issue"}}
    ChangeSetReport:
      type: object
      required: [schemaVersion, repository, comparison, changeSetDigest, summary, changes, diagnostics]
      properties:
        schemaVersion: {type: integer, const: 1}
        repository: {$ref: "#/components/schemas/ChangeRepository"}
        comparison: {$ref: "#/components/schemas/ChangeComparison"}
        changeSetDigest: {type: string}
        summary: {$ref: "#/components/schemas/ChangeSummary"}
        changes: {type: array, items: {$ref: "#/components/schemas/DocumentationChange"}}
        taskImpact: {$ref: "#/components/schemas/TaskImpactReport"}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/Issue"}}
    ScreenMapOverlay:
      type: object
      required: [schemaVersion, changeSetDigest, nodes, edges]
      properties:
        schemaVersion: {type: integer, const: 1}
        changeSetDigest: {type: string}
        nodes: {type: array, items: {$ref: "#/components/schemas/ScreenMapNode"}}
        edges: {type: array, items: {$ref: "#/components/schemas/ScreenMapEdge"}}
    ScreenMapNode:
      type: object
      required: [id, status, path, ghost]
      properties:
        id: {type: string}
        status: {type: string}
        path: {type: string}
        before: {$ref: "#/components/schemas/ScreenNodeSnapshot"}
        after: {$ref: "#/components/schemas/ScreenNodeSnapshot"}
        ghost: {type: boolean}
    ScreenMapEdge:
      type: object
      required: [id, status, ghost]
      properties:
        id: {type: string}
        status: {type: string}
        before: {$ref: "#/components/schemas/ScreenTransitionSnapshot"}
        after: {$ref: "#/components/schemas/ScreenTransitionSnapshot"}
        ghost: {type: boolean}
