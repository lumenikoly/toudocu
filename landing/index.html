<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose the language for the Docu-docu landing page. Выберите язык лендинга Docu-docu.">
    <meta name="theme-color" content="#F5E6CA">
    <title>Docu-docu — Choose language / Выберите язык</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script>
      (() => {
        const preferenceKey = "docu-docu-landing-locale";
        let locale = "";
        try {
          const saved = localStorage.getItem(preferenceKey);
          if (saved === "ru" || saved === "en") locale = saved;
        } catch {}
        if (!locale) {
          const primary = navigator.languages?.[0] || navigator.language || "";
          locale = /^ru(?:-|$)/i.test(primary) ? "ru" : "en";
        }
        location.replace(`./${locale}/`);
      })();
    </script>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f5e6ca; color: #0047ab; }
      main { width: min(560px, 100%); }
      h1 { margin: 0 0 12px; font-size: clamp(2.7rem, 10vw, 5.4rem); line-height: .9; letter-spacing: -.04em; }
      p { margin: 0 0 28px; font-size: 1.05rem; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 24px; border: 2px solid currentColor; border-radius: 999px; color: inherit; font-weight: 800; text-decoration: none; }
      a:hover { background: #fff; }
      a:focus-visible { outline: 3px solid #002d72; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>DOCU-DOCU</h1>
      <p>Choose your language. Выберите язык.</p>
      <nav aria-label="Language selection / Выбор языка">
        <a href="./en/" lang="en">English</a>
        <a href="./ru/" lang="ru">Русский</a>
      </nav>
    </main>
  </body>
</html>
