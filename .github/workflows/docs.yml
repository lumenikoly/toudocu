name: Docs contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify documentation contract
        run: node apps/cli/dist/main.js check ./docs --repository-root . --strict --stale-days 0
