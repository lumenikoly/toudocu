name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.0.7)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, rc]
      rc_number:
        description: RC number
        required: true
        default: '1'
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @toudocu/web-app exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:browser
      - name: Validate release input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$CHANNEL" == "rc" ]]; then
            [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]
            release_version="$VERSION-rc.$RC_NUMBER"
          else
            release_version="$VERSION"
          fi
          [[ "$(node apps/cli/dist/main.js version)" == "$VERSION" ]]
          [[ "$(grep -Fxc "## $VERSION" CHANGELOG.md)" == "1" ]]
          awk -v heading="## $VERSION" '
            $0 == heading { capture=1; next }
            /^## / && capture { exit }
            capture
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          ! git ls-remote --exit-code --tags origin "refs/tags/$release_version"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Exercise platform services
        run: >-
          pnpm exec vitest run
          packages/platform-node/src/filesystem
          packages/platform-node/src/git
          packages/platform-node/src/process-runner.test.ts
          packages/platform-node/src/project.test.ts
          packages/platform-node/src/pty
      - run: node scripts/release.mjs collect-native --output dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native
          if-no-files-found: error

  package:
    needs: [validate, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail
          release_version="$VERSION"
          if [[ "$CHANNEL" == "rc" ]]; then
            release_version="$VERSION-rc.$RC_NUMBER"
          fi
          node scripts/release.mjs package \
            --native-root dist/native \
            --output dist/release \
            --version "$release_version"
          cp "dist/release/toudocu-$release_version.tgz" dist/toudocu-package.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/toudocu-package.tgz
          if-no-files-found: error

  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - run: node scripts/release.mjs smoke --package dist/toudocu-package.tgz

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/release
      - name: Publish npm package and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail
          release_version="$VERSION"
          npm_tag="latest"
          release_flags=()
          if [[ "$CHANNEL" == "rc" ]]; then
            release_version="$VERSION-rc.$RC_NUMBER"
            npm_tag="next"
            release_flags+=(--prerelease)
          fi
          npm publish "dist/release/toudocu-$release_version.tgz" \
            --access public \
            --tag "$npm_tag" \
            --provenance
          gh release create "$release_version" dist/release/* \
            --target "$GITHUB_SHA" \
            --title "$release_version" \
            --notes-file release-notes.md \
            "${release_flags[@]}" \
            --fail-on-no-commits
