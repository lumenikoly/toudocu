name: release

on:
  push:
    tags: ['0.0.1']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag version
        run: test "$(go run ./cmd/docgent version)" = "$GITHUB_REF_NAME"
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Extract release notes
        run: |
          awk '/^## 0\.0\.1$/{capture=1; next} /^## /{if(capture) exit} capture' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
