name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: docgent-linux-amd64 }
          - { goos: linux, goarch: arm64, name: docgent-linux-arm64 }
          - { goos: darwin, goarch: amd64, name: docgent-darwin-amd64 }
          - { goos: darwin, goarch: arm64, name: docgent-darwin-arm64 }
          - { goos: windows, goarch: amd64, name: docgent-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o '${{ matrix.name }}' ./cmd/docgent
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
