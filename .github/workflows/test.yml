name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:browser

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Exercise filesystem, Git, process, and PTY adapters
        run: >-
          pnpm exec vitest run
          packages/platform-node/src/filesystem
          packages/platform-node/src/git
          packages/platform-node/src/process-runner.test.ts
          packages/platform-node/src/project.test.ts
          packages/platform-node/src/pty
      - run: node scripts/release.mjs collect-native --output dist/native
      - run: node apps/cli/dist/main.js version
