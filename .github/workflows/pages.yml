name: deploy landing to pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'project-docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare Pages artifact
        run: |
          mkdir -p "${RUNNER_TEMP}/docu-docu-pages/project-docs"
          cp -a landing/. "${RUNNER_TEMP}/docu-docu-pages/"
          cp -a project-docs/. "${RUNNER_TEMP}/docu-docu-pages/project-docs/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/docu-docu-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
