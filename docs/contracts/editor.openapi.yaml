openapi: 3.1.0
info:
  title: Toudocu Editor HTTP API
  version: "1"
  description: Wire-level contract for canonical serve-only portal services.
servers:
  - url: /
paths:
  /_toudocu/api/version:
    get:
      operationId: getToudocuVersionStatus
      summary: Compare the running version with the latest stable release
      responses:
        "200":
          description: Cached version status; upstream failures are represented as unavailable
          headers:
            Cache-Control: {$ref: "#/components/headers/NoStore"}
            X-Content-Type-Options: {$ref: "#/components/headers/NoSniff"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VersionResponse"}
              examples:
                updateAvailable:
                  value: {schemaVersion: 1, currentVersion: 0.8.0, status: update-available, latestVersion: 0.9.0, releaseURL: "https://github.com/lumenikoly/toudocu/releases/tag/0.9.0"}
                unavailable:
                  value: {schemaVersion: 1, currentVersion: dev, status: unavailable}
        "404": {description: Version check is disabled or the served root is a translation}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
    head:
      operationId: headToudocuVersionStatus
      summary: Check availability of the cached version status without a response body
      responses:
        "200": {description: Version status is available, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}, X-Content-Type-Options: {$ref: "#/components/headers/NoSniff"}}}
        "404": {description: Version check is disabled or the served root is a translation}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /_toudocu/api/editor/files:
    get:
      operationId: listEditorFiles
      summary: List editable documentation sources and templates
      parameters:
        - {$ref: "#/components/parameters/IfNoneMatch"}
      responses:
        "200":
          description: Current workspace snapshot
          headers:
            ETag: {schema: {type: string}, description: Quoted workspace revision}
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileListResponse"}
              example: {schemaVersion: 1, revision: abc123, files: [], templates: []}
        "304": {description: Workspace revision has not changed, headers: {ETag: {schema: {type: string}}, Cache-Control: {$ref: "#/components/headers/NoStore"}}}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/EditorError"}
  /_toudocu/api/editor/file:
    get:
      operationId: getEditorFile
      summary: Read a documentation source
      parameters:
        - {$ref: "#/components/parameters/PathQuery"}
        - name: raw
          in: query
          schema: {type: string, enum: ["1"]}
          description: Return read-only text/plain source instead of the JSON envelope.
      responses:
        "200":
          description: File envelope or raw source
          headers:
            Cache-Control: {$ref: "#/components/headers/NoStore"}
            X-Content-Type-Options: {$ref: "#/components/headers/NoSniff"}
          content:
            application/json: {schema: {$ref: "#/components/schemas/FileResponse"}}
            text/plain: {schema: {type: string}, example: "# Project\n"}
        "400": {$ref: "#/components/responses/EditorError"}
        "403": {$ref: "#/components/responses/EditorError"}
        "404": {$ref: "#/components/responses/EditorError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "415": {$ref: "#/components/responses/EditorError"}
        "500": {$ref: "#/components/responses/EditorError"}
    put:
      operationId: saveEditorFile
      summary: Atomically save a source with digest-based concurrency control
      parameters:
        - {$ref: "#/components/parameters/SaveAction"}
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/FetchSite"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveRequest"}
            example: {path: modules/site.md, content: "# Site\n", expectedDigest: abc123, confirmOverwrite: false}
      responses:
        "200": {description: Saved file and rebuild result, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/SavedFileResponse"}}}}
        "400": {$ref: "#/components/responses/EditorError"}
        "403": {$ref: "#/components/responses/EditorError"}
        "404": {$ref: "#/components/responses/EditorError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/EditorError"}
        "413": {$ref: "#/components/responses/EditorError"}
        "415": {$ref: "#/components/responses/EditorError"}
        "500": {$ref: "#/components/responses/EditorError"}
  /_toudocu/api/editor/roadmap:
    get:
      operationId: getEditorRoadmap
      summary: Read canonical roadmap state and the next suggested deliverable ID
      responses:
        "200": {description: Current roadmap editor state, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/RoadmapState"}}}}
        "404": {$ref: "#/components/responses/RoadmapNotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/EditorError"}
  /_toudocu/api/editor/roadmap/items:
    post:
      operationId: addEditorRoadmapItem
      summary: Add one unfinished deliverable to an existing roadmap stage
      parameters:
        - {$ref: "#/components/parameters/RoadmapAddAction"}
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/FetchSite"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoadmapItemRequest"}
            example: {stageAnchor: next-release, id: DLV-ROADMAP-001, text: Roadmap can be extended in serve., expectedDigest: abc123}
      responses:
        "201": {description: Created item, refreshed roadmap state and rebuild counts, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/RoadmapItemResponse"}}}}
        "400": {$ref: "#/components/responses/RoadmapRequestError"}
        "403": {$ref: "#/components/responses/EditorError"}
        "404": {$ref: "#/components/responses/RoadmapTargetNotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/RoadmapConflict"}
        "413": {$ref: "#/components/responses/EditorError"}
        "415": {$ref: "#/components/responses/EditorError"}
        "500": {$ref: "#/components/responses/EditorError"}
  /_toudocu/api/editor/preview:
    post:
      operationId: previewEditorSource
      summary: Render an in-memory Markdown source
      parameters:
        - {$ref: "#/components/parameters/PreviewAction"}
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/FetchSite"}
      requestBody: {$ref: "#/components/requestBodies/ContentRequest"}
      responses:
        "200": {description: Sanitized preview and diagnostics, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/PreviewResponse"}}}}
        "400": {$ref: "#/components/responses/EditorError"}
        "403": {$ref: "#/components/responses/EditorError"}
        "404": {$ref: "#/components/responses/EditorError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "413": {$ref: "#/components/responses/EditorError"}
        "415": {$ref: "#/components/responses/EditorError"}
        "500": {$ref: "#/components/responses/EditorError"}
  /_toudocu/api/editor/validate:
    post:
      operationId: validateEditorSource
      summary: Validate an in-memory documentation source
      parameters:
        - {$ref: "#/components/parameters/ValidateAction"}
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/FetchSite"}
      requestBody: {$ref: "#/components/requestBodies/ContentRequest"}
      responses:
        "200": {description: Positional diagnostics, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/ValidationResponse"}}}}
        "400": {$ref: "#/components/responses/EditorError"}
        "403": {$ref: "#/components/responses/EditorError"}
        "404": {$ref: "#/components/responses/EditorError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "413": {$ref: "#/components/responses/EditorError"}
        "415": {$ref: "#/components/responses/EditorError"}
        "500": {$ref: "#/components/responses/EditorError"}
  /_toudocu/api/editor/create:
    post:
      operationId: createEditorSource
      summary: Create a typed source from the shared scaffold registry
      parameters:
        - {$ref: "#/components/parameters/CreateAction"}
        - {$ref: "#/components/parameters/Origin"}
        - {$ref: "#/components/parameters/FetchSite"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRequest"}
            example: {template: module, language: ru, fields: {id: MOD-API, title: API}}
      responses:
        "201": {description: Created source and rebuild result, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {application/json: {schema: {$ref: "#/components/schemas/SavedFileResponse"}}}}
        "400": {$ref: "#/components/responses/EditorError"}
        "403": {$ref: "#/components/responses/EditorError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/EditorError"}
        "413": {$ref: "#/components/responses/EditorError"}
        "415": {$ref: "#/components/responses/EditorError"}
        "500": {$ref: "#/components/responses/EditorError"}
  /__toudocu/rebuild:
    post:
      operationId: rebuildDocumentationPortal
      summary: Manually rebuild the canonical serve portal
      parameters:
        - {$ref: "#/components/parameters/RebuildAction"}
      responses:
        "200":
          description: Rebuild counts (service response, not an Editor schema-v1 envelope)
          headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rebuild"}
              example: {documents: 65, pages: 86, warnings: 0, errors: 0}
        "403": {description: Missing or invalid action header, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {text/plain: {schema: {type: string}}}}
        "405": {description: Method not allowed, headers: {Allow: {schema: {type: string, const: POST}}, Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {text/plain: {schema: {type: string}}}}
        "500": {description: Rebuild failed, headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}, content: {text/plain: {schema: {type: string}}}}
components:
  headers:
    NoStore: {schema: {type: string, const: no-store}}
    NoSniff: {schema: {type: string, const: nosniff}}
  parameters:
    PathQuery: {name: path, in: query, required: true, schema: {type: string, minLength: 1}, example: modules/site.md}
    IfNoneMatch: {name: If-None-Match, in: header, schema: {type: string}, description: Quoted workspace revision returned as ETag}
    SaveAction: {name: X-Toudocu-Action, in: header, required: true, schema: {type: string, const: save}}
    PreviewAction: {name: X-Toudocu-Action, in: header, required: true, schema: {type: string, const: preview}}
    ValidateAction: {name: X-Toudocu-Action, in: header, required: true, schema: {type: string, const: validate}}
    CreateAction: {name: X-Toudocu-Action, in: header, required: true, schema: {type: string, const: create}}
    RoadmapAddAction: {name: X-Toudocu-Action, in: header, required: true, schema: {type: string, const: roadmap-add}}
    RebuildAction: {name: X-Toudocu-Action, in: header, required: true, schema: {type: string, const: rebuild}}
    Origin: {name: Origin, in: header, schema: {type: string, format: uri}}
    FetchSite: {name: Sec-Fetch-Site, in: header, schema: {type: string, const: same-origin}}
  requestBodies:
    ContentRequest:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ContentRequest"}
          example: {path: index.md, content: "# Project\n"}
  responses:
    EditorError:
      description: Editor API error
      headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    MethodNotAllowed:
      description: Method not allowed
      headers: {Allow: {schema: {type: string}}, Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}
    RoadmapNotFound:
      description: The canonical roadmap source is absent (`roadmap_not_found`).
      headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/RoadmapNotFoundEnvelope"}}}
    RoadmapRequestError:
      description: The JSON body is malformed or the proposed item is invalid (`invalid_json` or `invalid_roadmap_item`).
      headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/RoadmapRequestErrorEnvelope"}}}
    RoadmapTargetNotFound:
      description: The canonical roadmap or selected stage is absent (`roadmap_not_found` or `stage_not_found`).
      headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/RoadmapTargetNotFoundEnvelope"}}}
    RoadmapConflict:
      description: The ID already exists or the digest is stale (`duplicate_roadmap_id` or `stale_digest`). A stale response includes the refreshed roadmap state and never overwrites automatically.
      headers: {Cache-Control: {$ref: "#/components/headers/NoStore"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/RoadmapConflictEnvelope"}}}
  schemas:
    VersionResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, currentVersion, status]
      allOf:
        - if:
            properties: {status: {const: update-available}}
            required: [status]
          then:
            required: [latestVersion, releaseURL]
      properties:
        schemaVersion: {type: integer, const: 1}
        currentVersion: {type: string, minLength: 1}
        status: {type: string, enum: [up-to-date, update-available, unavailable]}
        latestVersion: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
        releaseURL: {type: string, format: uri, pattern: '^https://github\.com/lumenikoly/toudocu/releases/tag/[0-9]+\.[0-9]+\.[0-9]+$'}
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, message, path, line, column]
      properties:
        severity: {type: string, enum: [error, warning, info]}
        code: {type: string}
        message: {type: string}
        path: {type: string}
        line: {type: integer, minimum: 0}
        column: {type: integer, minimum: 0}
    FileSummary:
      type: object
      required: [path, language, size, digest]
      properties:
        path: {type: string}
        language: {type: string, enum: [markdown, yaml, json]}
        size: {type: integer, minimum: 0}
        digest: {type: string}
        title: {type: string}
        documentURL: {type: string}
    File:
      allOf:
        - {$ref: "#/components/schemas/FileSummary"}
        - type: object
          required: [content, diagnostics]
          properties:
            content: {type: string}
            diagnostics: {type: array, items: {$ref: "#/components/schemas/Diagnostic"}}
    TemplateField:
      type: object
      required: [name, label, type, required]
      properties:
        name: {type: string}
        label: {type: string}
        type: {type: string, enum: [text, select]}
        required: {type: boolean}
        options: {type: array, items: {type: string}}
    Template:
      type: object
      required: [key, label, fields, languages]
      properties:
        key: {type: string}
        label: {type: string}
        fields: {type: array, items: {$ref: "#/components/schemas/TemplateField"}}
        languages: {type: array, items: {type: string, enum: [ru, en]}}
    Rebuild:
      type: object
      additionalProperties: false
      required: [documents, pages, warnings, errors]
      properties:
        documents: {type: integer, minimum: 0}
        pages: {type: integer, minimum: 0}
        warnings: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
    RoadmapStage:
      type: object
      additionalProperties: false
      required: [anchor, title, status, itemCount]
      properties:
        anchor: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        status: {$ref: "#/components/schemas/StatusInfo"}
        itemCount: {type: integer, minimum: 0}
    StatusInfo:
      type: object
      additionalProperties: false
      required: [kind, symbol, label, recognized]
      properties:
        kind: {type: string}
        symbol: {type: string}
        label: {type: string}
        recognized: {type: boolean}
    RoadmapState:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, path, digest, suggestedId, stages]
      properties:
        schemaVersion: {type: integer, const: 1}
        revision: {type: string}
        path: {type: string, const: roadmap.md}
        digest: {type: string}
        suggestedId: {type: string, pattern: '^DLV-ROADMAP-[0-9]{3,}$'}
        stages: {type: array, items: {$ref: "#/components/schemas/RoadmapStage"}}
    RoadmapItemRequest:
      type: object
      additionalProperties: false
      required: [stageAnchor, id, text, expectedDigest]
      properties:
        stageAnchor: {type: string, minLength: 1}
        id: {type: string, pattern: '^DLV-[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'}
        text: {type: string, minLength: 1, pattern: '^[^\r\n]+$'}
        expectedDigest: {type: string, minLength: 1}
    CreatedRoadmapItem:
      type: object
      additionalProperties: false
      required: [stageAnchor, id, text, completed]
      properties:
        stageAnchor: {type: string}
        id: {type: string}
        text: {type: string}
        completed: {type: boolean, const: false}
    RoadmapItemResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, item, roadmap, rebuild]
      properties:
        schemaVersion: {type: integer, const: 1}
        item: {$ref: "#/components/schemas/CreatedRoadmapItem"}
        roadmap: {$ref: "#/components/schemas/RoadmapState"}
        rebuild: {$ref: "#/components/schemas/Rebuild"}
    RoadmapNotFoundEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, error]
      properties:
        schemaVersion: {type: integer, const: 1}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, const: roadmap_not_found}
            message: {type: string}
            details: {}
    RoadmapRequestErrorEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, error]
      properties:
        schemaVersion: {type: integer, const: 1}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_json, invalid_roadmap_item]}
            message: {type: string}
            details: {}
    RoadmapTargetNotFoundEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, error]
      properties:
        schemaVersion: {type: integer, const: 1}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [roadmap_not_found, stage_not_found]}
            message: {type: string}
            details: {}
    RoadmapConflictEnvelope:
      oneOf:
        - type: object
          additionalProperties: false
          required: [schemaVersion, error]
          properties:
            schemaVersion: {type: integer, const: 1}
            error:
              type: object
              additionalProperties: false
              required: [code, message, details]
              properties:
                code: {type: string, const: duplicate_roadmap_id}
                message: {type: string}
                details:
                  type: object
                  additionalProperties: false
                  required: [id]
                  properties: {id: {type: string}}
        - type: object
          additionalProperties: false
          required: [schemaVersion, error]
          properties:
            schemaVersion: {type: integer, const: 1}
            error:
              type: object
              additionalProperties: false
              required: [code, message, details]
              properties:
                code: {type: string, const: stale_digest}
                message: {type: string}
                details: {$ref: "#/components/schemas/RoadmapState"}
    FileListResponse:
      type: object
      required: [schemaVersion, revision, files, templates]
      properties:
        schemaVersion: {type: integer, const: 1}
        revision: {type: string}
        files: {type: array, items: {$ref: "#/components/schemas/FileSummary"}}
        templates: {type: array, items: {$ref: "#/components/schemas/Template"}}
    FileResponse:
      type: object
      required: [schemaVersion, revision, file]
      properties:
        schemaVersion: {type: integer, const: 1}
        revision: {type: string}
        file: {$ref: "#/components/schemas/File"}
    SavedFileResponse:
      type: object
      required: [schemaVersion, revision, file, rebuild]
      properties:
        schemaVersion: {type: integer, const: 1}
        revision: {type: string}
        file: {$ref: "#/components/schemas/File"}
        rebuild: {$ref: "#/components/schemas/Rebuild"}
    ContentRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: {type: string, minLength: 1}
        content: {type: string, maxLength: 2097152}
    SaveRequest:
      type: object
      additionalProperties: false
      required: [path, content, expectedDigest, confirmOverwrite]
      properties:
        path: {type: string, minLength: 1}
        content: {type: string, maxLength: 2097152}
        expectedDigest: {type: string}
        confirmOverwrite: {type: boolean}
    CreateRequest:
      type: object
      additionalProperties: false
      required: [template, language, fields]
      properties:
        template: {type: string, enum: [task-init, module, use-case, flow, screen, decision, standard, runbook]}
        language: {type: string, enum: [ru, en]}
        fields: {type: object, additionalProperties: {type: string}}
    PreviewResponse:
      type: object
      required: [schemaVersion, path, html, diagnostics]
      properties:
        schemaVersion: {type: integer, const: 1}
        path: {type: string}
        html: {type: string}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/Diagnostic"}}
    ValidationResponse:
      type: object
      required: [schemaVersion, path, diagnostics]
      properties:
        schemaVersion: {type: integer, const: 1}
        path: {type: string}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/Diagnostic"}}
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {}
    ErrorEnvelope:
      type: object
      required: [schemaVersion, error]
      properties:
        schemaVersion: {type: integer, const: 1}
        error: {$ref: "#/components/schemas/ErrorDetail"}
